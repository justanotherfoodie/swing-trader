# Trader - backend (FastAPI) + frontend (Next.js)
#
#   cp .env.example .env      # fill in optional API keys
#   docker compose up --build
#   open http://localhost:3000
#
# Secrets are read from the host .env at run time and are never baked into an image.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: trader-backend
    container_name: trader-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORTFOLIO_FILE: /data/portfolio.json
      # The browser talks to the frontend on :3000, so that origin must be allowed.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Optional. Absent -> template reasons / Yahoo headlines instead of AI + NewsAPI.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
    volumes:
      # Trade history survives `docker compose down` and image rebuilds.
      - portfolio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        # Baked into the client bundle at build time. The browser (on the host)
        # reaches the backend at the published port, NOT at the compose service
        # name - "backend" does not resolve outside the container network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: trader-frontend
    container_name: trader-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_started

volumes:
  portfolio-data:
